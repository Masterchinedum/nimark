version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nimark-store-db
    restart: unless-stopped
    ports:
      - '5436:5432'
    environment:
      POSTGRES_USER: nimark
      POSTGRES_PASSWORD: nimark_store_password
      POSTGRES_DB: nimark_store
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimark"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nimark-store-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
