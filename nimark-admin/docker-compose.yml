version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nimark-admin-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: nimark
      POSTGRES_PASSWORD: nimark_password
      POSTGRES_DB: nimark_admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimark"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
